# Isolated educational demo. File storage is an explicit opt-in, never the old user DB.
server.address=127.0.0.1
server.port=${DOJO_PORT:0}
spring.datasource.url=${DOJO_DATABASE_URL:jdbc:h2:mem:dojo_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false
server.error.include-message=never
server.servlet.session.tracking-modes=cookie
