<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="fragments :: head('courses.title')"></head>
  <body>
    <div th:replace="fragments :: header"></div>
    <main class="wrap" id="main" tabindex="-1">
      <p class="eyebrow" th:text="#{app.demo}"></p>
      <div class="page-heading">
        <div>
          <h1 th:text="#{courses.title}"></h1>
          <p th:text="#{courses.intro}"></p>
        </div>
        <a class="button" th:href="@{/nuevoCurso}" th:text="#{courses.new}"></a>
      </div>
      <div th:replace="fragments :: notice"></div>
      <ul class="roster">
        <li th:each="course : ${cursos}">
          <article class="roster-row course-row">
            <div>
              <h2 th:text="${course.nombre}"></h2>
              <p class="muted">
                <span th:text="#{label.year}"></span>
                <span th:text="${course.anio}"></span>
              </p>
            </div>
            <div>
              <span class="mobile-label" th:text="#{field.instructor}"></span>
              <span
                th:text="${course.sensei == null ? #messages.msg('value.noInstructor') : @dojoView.name(course.sensei)}"
              ></span>
            </div>
            <div>
              <p>
                <span
                  th:text="${#numbers.formatDecimal(course.precio,1,2)}"
                ></span>
                EUR
              </p>
              <p class="muted">
                <span th:text="#{label.enrolled}"></span>
                :
                <span th:text="${#lists.size(course.alumnos)}"></span>
              </p>
            </div>
            <div class="row-actions">
              <a
                th:href="@{/editarCurso/{id}(id=${course.id})}"
                th:text="#{action.edit}"
              ></a>
              <a
                th:href="@{/borrarCurso/{id}(id=${course.id})}"
                th:text="#{action.remove}"
              ></a>
            </div>
          </article>
        </li>
      </ul>
      <p
        class="empty"
        th:if="${#lists.isEmpty(cursos)}"
        th:text="#{empty.courses}"
      ></p>
    </main>
    <footer th:replace="fragments :: footer"></footer>
  </body>
</html>
