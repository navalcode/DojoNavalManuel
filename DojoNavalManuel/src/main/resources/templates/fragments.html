<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(titleKey)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <title th:text="${#messages.msg(titleKey)} + ' · Dojo'">Dojo</title>
    <link rel="stylesheet" th:href="@{/dojo.css}" />
    <script th:src="@{/dojo.js}" defer></script>
  </head>
  <body>
    <div th:fragment="header">
      <a class="skip" href="#main" th:text="#{nav.skip}">Skip to content</a>
      <header class="site-header wrap">
        <a class="brand" th:href="@{/}">Dojo</a>
        <nav th:attr="aria-label=#{nav.label}">
          <a
            th:href="@{/}"
            th:attr="aria-current=${section == 'students' ? 'page' : null}"
            th:text="#{nav.students}"
          >
            Students
          </a>
          <a
            th:href="@{/cursos}"
            th:attr="aria-current=${section == 'courses' ? 'page' : null}"
            th:text="#{nav.courses}"
          >
            Courses
          </a>
          <a
            th:href="@{/senseis}"
            th:attr="aria-current=${section == 'instructors' ? 'page' : null}"
            th:text="#{nav.instructors}"
          >
            Instructors
          </a>
        </nav>
        <nav class="languages" aria-label="Language / Idioma">
          <a
            th:if="${editorPage != true}"
            th:href="${esUrl}"
            lang="es"
            hreflang="es"
            th:attr="aria-current=${#locale.language == 'es' ? 'true' : null}"
          >
            ES
          </a>
          <a
            th:if="${editorPage != true}"
            th:href="${enUrl}"
            lang="en"
            hreflang="en"
            th:attr="aria-current=${#locale.language == 'en' ? 'true' : null}"
          >
            EN
          </a>
          <button
            th:if="${editorPage == true}"
            class="language-button"
            type="submit"
            form="editor-form"
            name="lang"
            value="es"
            lang="es"
            th:attr="aria-current=${#locale.language == 'es' ? 'true' : null}"
          >
            ES
          </button>
          <button
            th:if="${editorPage == true}"
            class="language-button"
            type="submit"
            form="editor-form"
            name="lang"
            value="en"
            lang="en"
            th:attr="aria-current=${#locale.language == 'en' ? 'true' : null}"
          >
            EN
          </button>
        </nav>
      </header>
    </div>
    <footer class="wrap footer" th:fragment="footer">
      <p
        th:text="${#messages.msg(memoryOnly ? 'footer.memory' : 'footer.stored')}"
      >
        Demo
      </p>
    </footer>
    <div
      class="notice"
      role="status"
      th:fragment="notice"
      th:if="${notice != null}"
      th:text="${#messages.msg(notice)}"
    ></div>
    <div
      class="error-summary"
      role="alert"
      tabindex="-1"
      data-error-summary
      th:fragment="errors"
      th:if="${#fields.hasAnyErrors()}"
    >
      <h2 th:text="#{form.errors}">Review the form</h2>
      <ul>
        <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
      </ul>
    </div>
  </body>
</html>
