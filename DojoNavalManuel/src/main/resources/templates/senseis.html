<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="fragments :: head('instructors.title')"></head>
  <body>
    <div th:replace="fragments :: header"></div>
    <main class="wrap" id="main" tabindex="-1">
      <p class="eyebrow" th:text="#{app.demo}"></p>
      <div class="page-heading">
        <div>
          <h1 th:text="#{instructors.title}"></h1>
          <p th:text="#{instructors.intro}"></p>
        </div>
        <a
          class="button"
          th:href="@{/nuevoSensei}"
          th:text="#{instructors.new}"
        ></a>
      </div>
      <div th:replace="fragments :: notice"></div>
      <ul class="roster">
        <li th:each="person : ${senseis}">
          <article class="roster-row">
            <div>
              <h2 th:text="${@dojoView.name(person)}"></h2>
              <p class="muted" th:text="${person.email}"></p>
            </div>
            <div>
              <span th:text="#{label.courses}"></span>
              :
              <span th:text="${#lists.size(person.curso)}"></span>
            </div>
            <div>
              <span class="mobile-label" th:text="#{label.salary}"></span>
              <span
                th:text="${#numbers.formatDecimal(person.sueldo,1,2)}"
              ></span>
              EUR
            </div>
            <div class="row-actions">
              <a
                th:href="@{/editarSensei/{id}(id=${person.id})}"
                th:text="#{action.edit}"
              ></a>
              <a
                th:href="@{/borrarSensei/{id}(id=${person.id})}"
                th:text="#{action.remove}"
              ></a>
            </div>
          </article>
        </li>
      </ul>
      <p
        class="empty"
        th:if="${#lists.isEmpty(senseis)}"
        th:text="#{empty.instructors}"
      ></p>
    </main>
    <footer th:replace="fragments :: footer"></footer>
  </body>
</html>
