<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="fragments :: head('detail.title')"></head>
  <body>
    <div th:replace="fragments :: header"></div>
    <main class="wrap" id="main" tabindex="-1">
      <a class="back-link" th:href="@{/}" th:text="#{action.back}"></a>
      <p class="eyebrow" th:text="#{detail.title}"></p>
      <div class="page-heading">
        <h1 th:text="${@dojoView.name(alumno)}"></h1>
        <a
          class="button"
          th:href="@{/editarAlumno/{id}(id=${alumno.id})}"
          th:text="#{action.edit}"
        ></a>
      </div>
      <div class="record-layout">
        <section>
          <h2 th:text="#{form.personal}"></h2>
          <dl class="record">
            <div>
              <dt th:text="#{field.email}"></dt>
              <dd
                th:text="${alumno.email != null and !#strings.isEmpty(alumno.email) ? alumno.email : #messages.msg('value.notSet')}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.birthDate}"></dt>
              <dd
                th:text="${alumno.fechaNacimiento != null and !#strings.isEmpty(alumno.fechaNacimiento) ? alumno.fechaNacimiento : #messages.msg('value.notSet')}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{detail.age}"></dt>
              <dd
                th:text="${@dojoView.age(alumno) != null and !#strings.isEmpty(@dojoView.age(alumno)) ? @dojoView.age(alumno) : #messages.msg('value.notSet')}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{label.belt}"></dt>
              <dd
                th:text="${@dojoView.belt(alumno.cinturon,#locale) != null and !#strings.isEmpty(@dojoView.belt(alumno.cinturon,#locale)) ? @dojoView.belt(alumno.cinturon,#locale) : #messages.msg('value.notSet')}"
              ></dd>
            </div>
          </dl>
        </section>
        <section>
          <h2 th:text="#{form.enrollment}"></h2>
          <dl class="record">
            <div>
              <dt th:text="#{label.course}"></dt>
              <dd
                th:text="${alumno.curso == null ? #messages.msg('value.noCourse') : alumno.curso.nombre}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.enrollmentDate}"></dt>
              <dd
                th:text="${alumno.fechaInscripcion ?: #messages.msg('value.notSet')}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.federation}"></dt>
              <dd
                th:text="${#messages.msg(alumno.federado == 'Si' ? 'form.yes' : 'form.no')}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.notes}"></dt>
              <dd
                class="preserve-lines"
                th:text="${#strings.isEmpty(alumno.comentarios) ? #messages.msg('value.notSet') : alumno.comentarios}"
              ></dd>
            </div>
          </dl>
        </section>
        <section>
          <h2 th:text="#{detail.contact}"></h2>
          <dl class="record">
            <div>
              <dt th:text="#{field.postalCode}"></dt>
              <dd
                th:text="${alumno.codigoPostal == 0 ? #messages.msg('value.notSet') : #numbers.formatInteger(alumno.codigoPostal,5)}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.phone}"></dt>
              <dd
                th:text="${#strings.isEmpty(alumno.telefono) ? #messages.msg('value.notSet') : alumno.telefono}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.documentNumber}"></dt>
              <dd
                th:text="${#strings.isEmpty(alumno.dni) ? #messages.msg('value.notSet') : alumno.dni}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.province}"></dt>
              <dd
                th:text="${#strings.isEmpty(alumno.provincia) ? #messages.msg('value.notSet') : alumno.provincia}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.city}"></dt>
              <dd
                th:text="${#strings.isEmpty(alumno.municipio) ? #messages.msg('value.notSet') : alumno.municipio}"
              ></dd>
            </div>
            <div>
              <dt th:text="#{field.address}"></dt>
              <dd
                th:text="${#strings.isEmpty(alumno.direccion) ? #messages.msg('value.notSet') : alumno.direccion}"
              ></dd>
            </div>
          </dl>
          <img
            class="portrait"
            th:if="${!#strings.isEmpty(alumno.imagen)}"
            th:src="${alumno.imagen}"
            th:alt="${@dojoView.name(alumno)}"
            referrerpolicy="no-referrer"
            loading="lazy"
          />
        </section>
      </div>
      <div class="form-actions">
        <a
          th:href="@{/borrarAlumno/{id}(id=${alumno.id})}"
          th:text="#{action.remove}"
        ></a>
      </div>
    </main>
    <footer th:replace="fragments :: footer"></footer>
  </body>
</html>
