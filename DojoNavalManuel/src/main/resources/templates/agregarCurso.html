<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head
    th:replace="fragments :: head(${form.id == null ? 'courses.new' : 'courses.edit'})"
  ></head>
  <body>
    <div th:replace="fragments :: header"></div>
    <main class="wrap" id="main" tabindex="-1">
      <p class="eyebrow" th:text="#{app.demo}"></p>
      <div class="page-heading">
        <div>
          <h1
            th:text="${#messages.msg(form.id == null ? 'courses.new' : 'courses.edit')}"
          ></h1>
          <p th:text="#{form.intro}"></p>
        </div>
      </div>
      <div th:replace="fragments :: notice"></div>
      <form
        id="editor-form"
        class="editor"
        method="post"
        novalidate
        th:object="${form}"
        th:action="${form.id == null ? '/addCurso' : '/editarCursoSubmit'}"
      >
        <input type="hidden" name="csrfToken" th:value="${session.formToken}" />
        <input type="hidden" th:field="*{id}" />
        <div th:replace="fragments :: errors"></div>
        <div class="field-grid course-form">
          <div class="field">
            <label for="name" th:text="#{field.name}"></label>
            <input
              id="name"
              type="text"
              th:field="*{name}"
              required
              aria-required="true"
              th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby='name-error'"
            />
            <p id="name-error" class="field-error" th:errors="*{name}"></p>
          </div>
          <div class="field">
            <label for="year" th:text="#{field.year}"></label>
            <input
              id="year"
              type="number"
              th:field="*{year}"
              required
              aria-required="true"
              step="1"
              th:attr="aria-invalid=${#fields.hasErrors('year')},aria-describedby='year-error'"
            />
            <p id="year-error" class="field-error" th:errors="*{year}"></p>
          </div>
          <div class="field">
            <label for="price" th:text="#{field.price}"></label>
            <input
              id="price"
              type="text"
              th:field="*{price}"
              required
              aria-required="true"
              th:attr="aria-invalid=${#fields.hasErrors('price')},aria-describedby='price-error'"
            />
            <p id="price-error" class="field-error" th:errors="*{price}"></p>
          </div>
          <div class="field">
            <label for="instructorId" th:text="#{field.instructor}"></label>
            <select
              id="instructorId"
              th:field="*{instructorId}"
              th:attr="aria-invalid=${#fields.hasErrors('instructorId')},aria-describedby='instructorId-error'"
            >
              <option value="" th:text="#{value.noInstructor}"></option>
              <option
                th:each="person : ${senseis}"
                th:value="${person.id}"
                th:text="${@dojoView.name(person)}"
              ></option>
            </select>
            <p
              id="instructorId-error"
              class="field-error"
              th:errors="*{instructorId}"
            ></p>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" th:text="#{action.saveCourse}"></button>
          <a th:href="@{/cursos}" th:text="#{action.cancel}"></a>
        </div>
      </form>
    </main>
    <footer th:replace="fragments :: footer"></footer>
  </body>
</html>
