<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="fragments :: head('students.title')"></head>
  <body>
    <div th:replace="fragments :: header"></div>
    <main class="wrap" id="main" tabindex="-1">
      <p class="eyebrow" th:text="#{app.demo}"></p>
      <div class="page-heading">
        <div>
          <h1 th:text="#{students.title}"></h1>
          <p th:text="#{students.intro}"></p>
        </div>
        <a class="button" th:href="@{/nuevo}" th:text="#{students.new}"></a>
      </div>
      <div th:replace="fragments :: notice"></div>
      <details class="filter-disclosure" open data-responsive-filter>
        <summary>
          <span th:text="#{filter.toggle}"></span>
          <span
            class="filter-context"
            th:text="${(selectedCourseName == null ? #messages.msg('filter.all') : selectedCourseName) + ' · ' + #messages.msg(sort == 'age' ? 'filter.age' : 'filter.name')}"
          ></span>
        </summary>
        <form class="filters" method="get" th:action="@{/}">
          <div class="filter-field">
            <label for="course-filter" th:text="#{filter.course}"></label>
            <select id="course-filter" name="idCurso">
              <option value="" th:text="#{filter.all}"></option>
              <option
                th:each="course : ${cursos}"
                th:value="${course.id}"
                th:selected="${selectedCourse != null and selectedCourse == course.id}"
                th:text="${course.nombre}"
              ></option>
            </select>
          </div>
          <div class="filter-field">
            <label for="order-filter" th:text="#{filter.order}"></label>
            <select id="order-filter" name="sort">
              <option
                value="name"
                th:selected="${sort == 'name'}"
                th:text="#{filter.name}"
              ></option>
              <option
                value="age"
                th:selected="${sort == 'age'}"
                th:text="#{filter.age}"
              ></option>
            </select>
          </div>
          <button type="submit" th:text="#{filter.apply}"></button>
          <a th:href="@{/}" th:text="#{filter.reset}"></a>
        </form>
      </details>
      <p class="result-count">
        <span th:text="#{students.count}"></span>
        :
        <strong th:text="${#lists.size(alumnos)}"></strong>
      </p>
      <div class="roster-labels" aria-hidden="true">
        <span th:text="#{label.student}"></span>
        <span th:text="#{label.course}"></span>
        <span th:text="#{label.belt}"></span>
        <span th:text="#{label.actions}"></span>
      </div>
      <ul class="roster">
        <li th:each="student : ${alumnos}">
          <article class="roster-row">
            <div>
              <h2>
                <a
                  th:href="@{/detalleAlumnos/{id}(id=${student.id})}"
                  th:text="${@dojoView.name(student)}"
                ></a>
              </h2>
              <p class="muted" th:text="${student.email}"></p>
            </div>
            <div>
              <span class="mobile-label" th:text="#{label.course}"></span>
              <span
                th:text="${student.curso == null ? #messages.msg('value.noCourse') : student.curso.nombre}"
              ></span>
            </div>
            <div>
              <span class="mobile-label" th:text="#{label.belt}"></span>
              <span
                th:text="${@dojoView.belt(student.cinturon,#locale)}"
              ></span>
            </div>
            <div class="row-actions">
              <a
                th:href="@{/detalleAlumnos/{id}(id=${student.id})}"
                th:text="#{action.view}"
                th:attr="aria-label=${#messages.msg('action.view') + ': ' + @dojoView.name(student)}"
              ></a>
              <a
                th:href="@{/editarAlumno/{id}(id=${student.id})}"
                th:text="#{action.edit}"
                th:attr="aria-label=${#messages.msg('action.edit') + ': ' + @dojoView.name(student)}"
              ></a>
            </div>
          </article>
        </li>
      </ul>
      <p
        class="empty"
        th:if="${#lists.isEmpty(alumnos)}"
        th:text="#{empty.students}"
      ></p>
    </main>
    <footer th:replace="fragments :: footer"></footer>
  </body>
</html>
