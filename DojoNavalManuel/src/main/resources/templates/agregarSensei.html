<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head
    th:replace="fragments :: head(${form.id == null ? 'instructor.new' : 'instructor.edit'})"
  ></head>
  <body>
    <div th:replace="fragments :: header"></div>
    <main class="wrap" id="main" tabindex="-1">
      <p class="eyebrow" th:text="#{app.demo}"></p>
      <div class="page-heading">
        <div>
          <h1
            th:text="${#messages.msg(form.id == null ? 'instructor.new' : 'instructor.edit')}"
          ></h1>
          <p th:text="#{form.intro}"></p>
        </div>
      </div>
      <form
        id="editor-form"
        class="editor"
        method="post"
        novalidate
        th:object="${form}"
        th:action="${form.id == null ? '/addSensei' : '/editarSenseiSubmit'}"
      >
        <input type="hidden" name="csrfToken" th:value="${session.formToken}" />
        <input type="hidden" th:field="*{id}" />
        <div th:replace="fragments :: errors"></div>
        <section class="form-section">
          <div>
            <h2 th:text="#{form.personal}"></h2>
            <p class="muted" th:text="#{form.personalHelp}"></p>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="name" th:text="#{field.name}"></label>
              <input
                id="name"
                type="text"
                th:field="*{name}"
                required
                aria-required="true"
                th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby='name-error'"
              />
              <p id="name-error" class="field-error" th:errors="*{name}"></p>
            </div>
            <div class="field">
              <label for="firstSurname" th:text="#{field.firstSurname}"></label>
              <input
                id="firstSurname"
                type="text"
                th:field="*{firstSurname}"
                required
                aria-required="true"
                th:attr="aria-invalid=${#fields.hasErrors('firstSurname')},aria-describedby='firstSurname-error'"
              />
              <p
                id="firstSurname-error"
                class="field-error"
                th:errors="*{firstSurname}"
              ></p>
            </div>
            <div class="field">
              <label
                for="secondSurname"
                th:text="#{field.secondSurname}"
              ></label>
              <input
                id="secondSurname"
                type="text"
                th:field="*{secondSurname}"
                th:attr="aria-invalid=${#fields.hasErrors('secondSurname')},aria-describedby='secondSurname-error'"
              />
              <p
                id="secondSurname-error"
                class="field-error"
                th:errors="*{secondSurname}"
              ></p>
            </div>
            <div class="field">
              <label for="birthDate" th:text="#{field.birthDate}"></label>
              <input
                id="birthDate"
                type="date"
                th:field="*{birthDate}"
                th:attr="aria-invalid=${#fields.hasErrors('birthDate')},aria-describedby='birthDate-error'"
              />
              <p
                id="birthDate-error"
                class="field-error"
                th:errors="*{birthDate}"
              ></p>
            </div>
            <div class="field">
              <label for="email" th:text="#{field.email}"></label>
              <input
                id="email"
                type="email"
                th:field="*{email}"
                th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby='email-error'"
              />
              <p id="email-error" class="field-error" th:errors="*{email}"></p>
            </div>
            <div class="field">
              <label for="belt" th:text="#{label.belt}"></label>
              <select
                id="belt"
                th:field="*{belt}"
                th:attr="aria-invalid=${#fields.hasErrors('belt')},aria-describedby='belt-error'"
              >
                <option value="" th:text="#{value.notSet}"></option>
                <option
                  th:each="belt : ${beltOptions}"
                  th:value="${belt}"
                  th:text="${@dojoView.belt(belt,#locale)}"
                ></option>
              </select>
              <p id="belt-error" class="field-error" th:errors="*{belt}"></p>
            </div>
          </div>
        </section>
        <section class="form-section">
          <div>
            <h2 th:text="#{form.enrollment}"></h2>
            <p class="muted" th:text="#{form.enrollmentHelp}"></p>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="salary" th:text="#{field.salary}"></label>
              <input
                id="salary"
                type="text"
                th:field="*{salary}"
                th:attr="aria-invalid=${#fields.hasErrors('salary')},aria-describedby='salary-error'"
              />
              <p
                id="salary-error"
                class="field-error"
                th:errors="*{salary}"
              ></p>
            </div>
          </div>
        </section>
        <details
          class="contact-details"
          th:open="${#fields.hasErrors('postalCode') or #fields.hasErrors('phone') or #fields.hasErrors('address') or #fields.hasErrors('province') or #fields.hasErrors('city') or #fields.hasErrors('documentNumber') or #fields.hasErrors('imageUrl')}"
        >
          <summary th:text="#{form.contact}"></summary>
          <p class="muted" th:text="#{form.contactHelp}"></p>
          <div class="field-grid">
            <div class="field">
              <label for="phone" th:text="#{field.phone}"></label>
              <input
                id="phone"
                type="text"
                th:field="*{phone}"
                th:attr="aria-invalid=${#fields.hasErrors('phone')},aria-describedby='phone-error'"
              />
              <p id="phone-error" class="field-error" th:errors="*{phone}"></p>
            </div>
            <div class="field">
              <label
                for="documentNumber"
                th:text="#{field.documentNumber}"
              ></label>
              <input
                id="documentNumber"
                type="text"
                th:field="*{documentNumber}"
                th:attr="aria-invalid=${#fields.hasErrors('documentNumber')},aria-describedby='documentNumber-error'"
              />
              <p
                id="documentNumber-error"
                class="field-error"
                th:errors="*{documentNumber}"
              ></p>
            </div>
            <div class="field">
              <label for="province" th:text="#{field.province}"></label>
              <input
                id="province"
                type="text"
                th:field="*{province}"
                th:attr="aria-invalid=${#fields.hasErrors('province')},aria-describedby='province-error'"
              />
              <p
                id="province-error"
                class="field-error"
                th:errors="*{province}"
              ></p>
            </div>
            <div class="field">
              <label for="postalCode" th:text="#{field.postalCode}"></label>
              <input
                id="postalCode"
                type="text"
                th:field="*{postalCode}"
                th:attr="aria-invalid=${#fields.hasErrors('postalCode')},aria-describedby='postalCode-error'"
              />
              <p
                id="postalCode-error"
                class="field-error"
                th:errors="*{postalCode}"
              ></p>
            </div>
            <div class="field">
              <label for="city" th:text="#{field.city}"></label>
              <input
                id="city"
                type="text"
                th:field="*{city}"
                th:attr="aria-invalid=${#fields.hasErrors('city')},aria-describedby='city-error'"
              />
              <p id="city-error" class="field-error" th:errors="*{city}"></p>
            </div>
            <div class="field">
              <label for="address" th:text="#{field.address}"></label>
              <input
                id="address"
                type="text"
                th:field="*{address}"
                th:attr="aria-invalid=${#fields.hasErrors('address')},aria-describedby='address-error'"
              />
              <p
                id="address-error"
                class="field-error"
                th:errors="*{address}"
              ></p>
            </div>
            <div class="field">
              <label for="imageUrl" th:text="#{field.imageUrl}"></label>
              <input
                id="imageUrl"
                type="url"
                th:field="*{imageUrl}"
                th:attr="aria-invalid=${#fields.hasErrors('imageUrl')},aria-describedby='imageUrl-error'"
              />
              <p
                id="imageUrl-error"
                class="field-error"
                th:errors="*{imageUrl}"
              ></p>
            </div>
          </div>
        </details>
        <div class="form-actions">
          <button type="submit" th:text="#{action.saveInstructor}"></button>
          <a th:href="@{/senseis}" th:text="#{action.cancel}"></a>
        </div>
      </form>
    </main>
    <footer th:replace="fragments :: footer"></footer>
  </body>
</html>
