<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="fragments :: head('confirm.title')"></head>
  <body>
    <div th:replace="fragments :: header"></div>
    <main class="wrap" id="main" tabindex="-1">
      <section class="message-page">
        <h1 th:text="#{confirm.title}"></h1>
        <p class="record-name" th:text="${record.nombre}"></p>
        <p th:text="#{confirm.note}"></p>
        <form method="post" th:action="${deletePath}" class="form-actions">
          <input
            type="hidden"
            name="csrfToken"
            th:value="${session.formToken}"
          />
          <button type="submit" th:text="#{action.confirm}"></button>
          <a th:href="${backPath}" th:text="#{action.cancel}"></a>
        </form>
      </section>
    </main>
    <footer th:replace="fragments :: footer"></footer>
  </body>
</html>
